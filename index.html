<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Articleship Memories ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4e1, #fff5ee);
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #b76e79;
            margin-bottom: 10px;
        }
        .dates {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .tagline {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555;
        }
        .btn {
            display: inline-block;
            background-color: #b76e79;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(183, 110, 121, 0.3);
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #a35d68;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Articleship Memories ❤️</h1>
        <div class="dates">August 2024 — August 2026</div>
        
        <p class="tagline">
            Two years.<br>
            So many people.<br>
            So many memories. ❤️
        </p>

        <a href="#memories" class="btn">Open My Memories →</a>
    </div>

</body>
</html>
